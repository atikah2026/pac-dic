<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>26 PAC Multi-Ring Gauge Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0F172A',
                        cardbg: '#1E293B',
                        accent: '#38BDF8'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/highcharts@11.4.0/highcharts.js" onerror="this.src='https://cdnjs.cloudflare.com/ajax/libs/highcharts/11.4.0/highcharts.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/highcharts@11.4.0/highcharts-more.js" onerror="this.src='https://cdnjs.cloudflare.com/ajax/libs/highcharts/11.4.0/highcharts-more.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/highcharts@11.4.0/modules/solid-gauge.js" onerror="this.src='https://cdnjs.cloudflare.com/ajax/libs/highcharts/11.4.0/modules/solid-gauge.js'"></script>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #ffffff;
        }
        #gaugeContainer {
            width: 100vw;
            height: 100vh;
            min-height: 400px;
        }
        .highcharts-legend-item text {
            fill: #334155 !important;
            font-size: 11px !important;
            font-weight: 500 !important;
        }
        .highcharts-legend-item:hover text {
            fill: #0284c7 !important;
        }
    </style>
</head>
<body class="bg-white text-slate-800 min-h-screen font-sans antialiased flex flex-col items-center justify-center p-0 m-0">

    <div id="gaugeContainer" class="w-full h-full flex items-center justify-center p-2 bg-white">
        <div id="loadingState" class="flex flex-col items-center gap-3 text-slate-500">
            <i class="fa-solid fa-circle-notch fa-spin text-3xl text-sky-600"></i>
            <span class="text-xs font-medium">Loading Gauge Visual...</span>
        </div>
    </div>

    <script>
        // Exact 26 PAC entities matching your updated QuickSight setup
        const PAC_LIST = [
            { name: "BRIDGE", defaultVal: 0, color: "#20419A" },
            { name: "CHEVRON", defaultVal: 0, color: "#00B1A9" },
            { name: "COP", defaultVal: 0, color: "#763F98" },
            { name: "DIALOG", defaultVal: 0, color: "#BFD730" },
            { name: "ENQUEST", defaultVal: 0, color: "#1BBCF5" },
            { name: "EPOMS", defaultVal: 0, color: "#7D86D9" },
            { name: "HIBISCUS", defaultVal: 0, color: "#999999" },
            { name: "INPEX", defaultVal: 0, color: "#BA9FCB" },
            { name: "IPC", defaultVal: 0, color: "#AEE2E0" },
            { name: "JSE", defaultVal: 0, color: "#AB1C1F" },
            { name: "ME", defaultVal: 0, color: "#03B050" },
            { name: "MEDCO", defaultVal: 0, color: "#C48700" },
            { name: "PCSB", defaultVal: 0, color: "#BBC9DD" },
            { name: "PETRA", defaultVal: 0, color: "#9784DA" },
            { name: "PETROFAC", defaultVal: 0, color: "#FCDBE6" },
            { name: "PING", defaultVal: 0, color: "#FFE3A7" },
            { name: "POSCO", defaultVal: 0, color: "#FF0101" },
            { name: "PTTEP", defaultVal: 0, color: "#4A90E2" },
            { name: "SEARAH", defaultVal: 0, color: "#50E3C2" },
            { name: "SEASCAPE", defaultVal: 0, color: "#B8E986" },
            { name: "SHELL", defaultVal: 0, color: "#F5A623" },
            { name: "SKEO", defaultVal: 0, color: "#D0021B" },
            { name: "SUMDP", defaultVal: 0, color: "#9013FE" },
            { name: "TEPMY", defaultVal: 0, color: "#8B572A" },
            { name: "VESTIGO", defaultVal: 0, color: "#7ED321" },
            { name: "XPLORA", defaultVal: 0, color: "#417505" }
        ];

        let pacValues = {};
        let chartInstance = null;
        let attempts = 0;

        function checkAndRender() {
            attempts++;
            if (window.Highcharts && window.Highcharts.seriesTypes && window.Highcharts.seriesTypes.solidgauge) {
                renderChart();
            } else if (attempts < 60) {
                setTimeout(checkAndRender, 100);
            } else {
                renderSvgFallback();
            }
        }

        function loadValuesFromUrlOrDefaults() {
            const urlParams = new URLSearchParams(window.location.search);
            PAC_LIST.forEach(pac => {
                const exactVal = urlParams.get(pac.name);
                const lowerVal = urlParams.get(pac.name.toLowerCase());
                const calcFieldVal = urlParams.get(`${pac.name}value`) || urlParams.get(`${pac.name}VALUE`) || urlParams.get(`${pac.name}_value`);
                const completionRateVal = urlParams.get(`${pac.name}_Completion_Rate`) || urlParams.get(`${pac.name}_rate`);
                
                const rawParamVal = exactVal ?? lowerVal ?? calcFieldVal ?? completionRateVal;

                if (rawParamVal !== null && rawParamVal !== "" && !isNaN(rawParamVal)) {
                    let parsed = parseFloat(rawParamVal);
                    if (parsed <= 1 && parsed > 0) parsed = parsed * 100;
                    pacValues[pac.name] = Math.min(100, Math.max(0, parsed));
                } else {
                    pacValues[pac.name] = pac.defaultVal;
                }
            });
        }

        function renderChart() {
            loadValuesFromUrlOrDefaults();

            const container = document.getElementById('gaugeContainer');
            if (!container) return;
            
            const paneList = [];
            const yAxisList = [];
            const seriesList = [];
            
            const totalPACs = PAC_LIST.length;
            const outerRadius = 100;
            const innerMinRadius = 12;
            const step = (outerRadius - innerMinRadius) / totalPACs;

            PAC_LIST.forEach((pac, index) => {
                const ringRadius = outerRadius - (index * step);
                const ringInnerRadius = outerRadius - ((index + 1) * step);
                const val = pacValues[pac.name] ?? pac.defaultVal;

                // Added explicit background tracks so empty/0% rings are fully visible
                paneList.push({
                    startAngle: 0,
                    endAngle: 360,
                    background: [{
                        outerRadius: `${ringRadius.toFixed(1)}%`,
                        innerRadius: `${(ringInnerRadius + 0.3).toFixed(1)}%`,
                        backgroundColor: 'rgba(241, 245, 249, 0.9)',
                        borderWidth: 0
                    }],
                    size: `${ringRadius.toFixed(1)}%`
                });

                yAxisList.push({
                    pane: index,
                    min: 0,
                    max: 100,
                    lineWidth: 0,
                    tickPositions: []
                });

                seriesList.push({
                    name: pac.name,
                    yAxis: index,
                    data: [{
                        color: pac.color,
                        radius: `${ringRadius.toFixed(1)}%`,
                        innerRadius: `${(ringInnerRadius + 0.3).toFixed(1)}%`,
                        y: val
                    }],
                    color: pac.color,
                    legendIndex: index + 1
                });
            });

            container.innerHTML = '';

            chartInstance = Highcharts.chart('gaugeContainer', {
                chart: {
                    type: 'solidgauge',
                    backgroundColor: '#FFFFFF',
                    animation: true
                },
                title: { text: null },
                credits: { enabled: false },
                colors: PAC_LIST.map(p => p.color),
                pane: paneList,
                yAxis: yAxisList,
                plotOptions: {
                    solidgauge: {
                        dataLabels: { enabled: false },
                        linecap: 'square',
                        showInLegend: true,
                        legendSymbol: 'rectangle'
                    }
                },
                legend: {
                    enabled: true,
                    align: 'center',
                    verticalAlign: 'bottom',
                    layout: 'horizontal',
                    maxHeight: 120,
                    itemDistance: 12,
                    symbolWidth: 10,
                    symbolHeight: 10,
                    symbolPadding: 4,
                    itemStyle: {
                        color: '#334155',
                        fontSize: '10px',
                        fontWeight: '500'
                    },
                    itemHoverStyle: {
                        color: '#0284c7'
                    }
                },
                tooltip: {
                    enabled: true,
                    shared: false,
                    useHTML: true,
                    backgroundColor: 'rgba(255, 255, 255, 0.95)',
                    borderColor: '#CBD5E1',
                    borderRadius: 8,
                    shadow: true,
                    pointFormat: '<span style="color:{series.color}">●</span> <b>{series.name}</b>: {point.y:,.2f}%'
                },
                series: seriesList
            });
        }

        function renderSvgFallback() {
            loadValuesFromUrlOrDefaults();
            const container = document.getElementById('gaugeContainer');
            if (!container) return;

            let svgHtml = `<div class="flex flex-col items-center justify-center w-full h-full p-2">
                <svg viewBox="0 0 400 400" class="w-full max-h-[75vh]">`;
            
            const totalPACs = PAC_LIST.length;
            const center = 200;
            const maxR = 180;
            const minR = 20;
            const step = (maxR - minR) / totalPACs;

            PAC_LIST.forEach((pac, index) => {
                const r = maxR - (index * step);
                const strokeWidth = step - 1;
                const val = pacValues[pac.name] ?? pac.defaultVal;
                const circum = 2 * Math.PI * r;
                const offset = circum - (val / 100) * circum;

                svgHtml += `
                    <circle cx="${center}" cy="${center}" r="${r}" fill="none" stroke="#f1f5f9" stroke-width="${strokeWidth}" />
                    <circle cx="${center}" cy="${center}" r="${r}" fill="none" stroke="${pac.color}" stroke-width="${strokeWidth}"
                            stroke-dasharray="${circum}" stroke-dashoffset="${offset}" transform="rotate(-90 ${center} ${center})" />
                `;
            });

            svgHtml += `</svg><div class="flex flex-wrap justify-center gap-x-3 gap-y-1 mt-2 max-h-[20vh] overflow-y-auto">`;

            PAC_LIST.forEach(pac => {
                const val = pacValues[pac.name] ?? pac.defaultVal;
                svgHtml += `<div class="flex items-center gap-1 text-[10px] text-slate-700">
                    <span class="w-2.5 h-2.5 rounded-sm inline-block" style="background-color:${pac.color}"></span>
                    <span>${pac.name}: <b>${val.toFixed(1)}%</b></span>
                </div>`;
            });

            svgHtml += `</div></div>`;
            container.innerHTML = svgHtml;
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', checkAndRender);
        } else {
            checkAndRender();
        }
    </script>
</body>
</html>
